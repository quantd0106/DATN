[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-course-document"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
    "pymupdf>=1.25,<2",
    "defusedxml>=0.7,<1",
    "pillow",
    "python-docx",
    "python-pptx",
    "pdfplumber",
    "pypdf",
    "beautifulsoup4",
    "lxml",
    "tabulate",
    "PyYAML",
    "Markdown",
    "numpy",
    "opencv-python-headless",
    "pypandoc-binary",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx2>=2,<3", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
