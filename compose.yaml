services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_course}
      POSTGRES_USER: ${POSTGRES_USER:-rag_course}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_course} -d ${POSTGRES_DB:-rag_course}"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: ${CORE_IMAGE:-rag-course-core:local}
    build: ./services/core
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rag_course:change-me-local-only@db:5432/rag_course}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  core:
    image: ${CORE_IMAGE:-rag-course-core:local}
    build: ./services/core
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rag_course:change-me-local-only@db:5432/rag_course}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-3}
      NOTIFICATION_PAGE_SIZE_DEFAULT: ${NOTIFICATION_PAGE_SIZE_DEFAULT:-20}
      SECRET_KEY:
      INTERNAL_SERVICE_SECRET:
      COOKIE_SECURE:
      STUDENT_ACTIVATION_EXPIRE_HOURS: ${STUDENT_ACTIVATION_EXPIRE_HOURS:-24}
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USERNAME:
      SMTP_PASSWORD:
      SMTP_FROM:
      SMTP_SECURITY:
      SMTP_TIMEOUT_SECONDS:
    ports:
      - "127.0.0.1:${CORE_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  notification-worker:
    image: ${CORE_IMAGE:-rag-course-core:local}
    build: ./services/core
    command: ["python", "-m", "app.background_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rag_course:change-me-local-only@db:5432/rag_course}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  document-db-init:
    image: postgres:16-alpine
    command: ["sh", "/init/init-document-db.sh"]
    volumes:
      - ./services/document/docker/init-document-db.sh:/init/init-document-db.sh:ro
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-rag_course}
      PGUSER: ${POSTGRES_USER:-rag_course}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      DOCUMENT_DB_USER: ${DOCUMENT_DB_USER:-document_svc}
      DOCUMENT_DB_PASSWORD: ${DOCUMENT_DB_PASSWORD:-document-change-me-local-only}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  document-migrate:
    image: ${DOCUMENT_IMAGE:-rag-course-document:local}
    build:
      context: .
      dockerfile: services/document/Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DOCUMENT_DATABASE_URL: ${DOCUMENT_DATABASE_URL:-postgresql+psycopg://${DOCUMENT_DB_USER:-document_svc}:${DOCUMENT_DB_PASSWORD:-document-change-me-local-only}@db:5432/${POSTGRES_DB:-rag_course}}
    depends_on:
      db:
        condition: service_healthy
      document-db-init:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  document:
    image: ${DOCUMENT_IMAGE:-rag-course-document:local}
    build:
      context: .
      dockerfile: services/document/Dockerfile
    environment:
      DOCUMENT_DATABASE_URL: ${DOCUMENT_DATABASE_URL:-postgresql+psycopg://${DOCUMENT_DB_USER:-document_svc}:${DOCUMENT_DB_PASSWORD:-document-change-me-local-only}@db:5432/${POSTGRES_DB:-rag_course}}
      CORE_API_URL: ${CORE_API_URL:-http://core:8000}
      INTERNAL_SERVICE_SECRET:
      DOCUMENT_STORAGE_PATH: /var/lib/lumi-document
      DOCUMENT_MAX_SIZE_BYTES: ${DOCUMENT_MAX_SIZE_BYTES:-20971520}
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-300}
      CORE_CLIENT_TIMEOUT_SECONDS: ${CORE_CLIENT_TIMEOUT_SECONDS:-3.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "127.0.0.1:${DOCUMENT_PORT:-8001}:8001"
    volumes:
      - document_data:/var/lib/lumi-document
    depends_on:
      db:
        condition: service_healthy
      document-migrate:
        condition: service_completed_successfully
      core:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  document-worker:
    image: ${DOCUMENT_IMAGE:-rag-course-document:local}
    build:
      context: .
      dockerfile: services/document/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      DOCUMENT_DATABASE_URL: ${DOCUMENT_DATABASE_URL:-postgresql+psycopg://${DOCUMENT_DB_USER:-document_svc}:${DOCUMENT_DB_PASSWORD:-document-change-me-local-only}@db:5432/${POSTGRES_DB:-rag_course}}
      DOCUMENT_STORAGE_PATH: /var/lib/lumi-document
      DOCUMENT_MAX_SIZE_BYTES: ${DOCUMENT_MAX_SIZE_BYTES:-20971520}
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-300}
      DOCUMENT_WORKER_LEASE_SECONDS: ${DOCUMENT_WORKER_LEASE_SECONDS:-300}
      DOCUMENT_WORKER_POLL_SECONDS: ${DOCUMENT_WORKER_POLL_SECONDS:-1.0}
    volumes:
      - document_data:/var/lib/lumi-document
    depends_on:
      db:
        condition: service_healthy
      document-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_DATA_MODE: ${NEXT_PUBLIC_DATA_MODE:-live}
      CORE_API_URL: ${CORE_API_URL:-http://core:8000}
      DOCUMENT_API_URL: ${DOCUMENT_API_URL:-http://document:8001}
      LEARNING_API_URL: ${LEARNING_API_URL:-}
      AI_API_URL: ${AI_API_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      core:
        condition: service_healthy
      document:
        condition: service_healthy
volumes:
  pgdata:
  document_data:
